<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wildflowers</title>
<meta name="theme-color" content="#0b0e1e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0e1e;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; left: 0; top: 0; cursor: grab; }
  #c:active { cursor: grabbing; }
  .txt {
    position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: 'IBM Plex Mono', Consolas, 'Courier New', monospace; padding: 0 16px;
  }
  #msg {
    bottom: max(3.5vh, calc(env(safe-area-inset-bottom) + 14px));
    color: #ff8fbf; font-weight: 700; letter-spacing: .06em;
    font-size: clamp(12px, 2.6vw, 20px);
    text-shadow: 0 0 8px rgba(255, 110, 170, .75), 0 0 2px rgba(255, 110, 170, .9);
    opacity: 0; transition: opacity 3s ease;
  }
  #msg.show { opacity: 1; }
  #hint {
    top: max(2.5vh, calc(env(safe-area-inset-top) + 10px));
    color: #9aa3c8; font-size: clamp(10px, 2vw, 13px); letter-spacing: .05em;
    opacity: 0; transition: opacity 1.5s ease;
  }
  #hint.show { opacity: .7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg" class="txt"></div>
<div id="hint" class="txt"></div>

<script>
'use strict';

/* =====================================================================
   SETTINGS: edit messages here.
   month is 1-12. Preview a date with ?date=MM-DD in the URL.
   ===================================================================== */
const CONFIG = {
  messages: [
    { month: 2,  day: 2,  text: 'Happy Birthday!',        theme: 'birthday'    },
    { month: 2,  day: 14, text: "Happy Valentine's Day",  theme: 'valentine'   },
    { month: 6,  day: 24, text: 'Happy Anniversary',      theme: 'anniversary' },
    { month: 12, day: 24, text: 'Merry Christmas Eve',    theme: 'christmas'   },
    { month: 12, day: 25, text: 'Merry Christmas',        theme: 'christmas'   },
  ],
  defaultMessage: 'picked just for you',
  arizonaOnly: false,     // true = only Sonoran Desert natives; false = mostly Arizona + a few classics
  colorCycleSeconds: 300, // slow background colour drift
  spinSpeed: 0.12,        // radians per second (about 52 s per full turn)
};

/* ---------- small helpers ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rgb = h => [h >> 16 & 255, h >> 8 & 255, h & 255];
const pick = (arr, r) => arr[Math.floor(r() * arr.length)];
function shuffle(arr, r) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const params = new URLSearchParams(location.search);

function todaysMessage() {
  const q = params.get('date');
  let m, d;
  if (q && /^\d{1,2}-\d{1,2}$/.test(q)) [m, d] = q.split('-').map(Number);
  else { const now = new Date(); m = now.getMonth() + 1; d = now.getDate(); }
  return CONFIG.messages.find(e => e.month === m && e.day === d) || { text: CONFIG.defaultMessage, theme: 'default' };
}

/* =====================================================================
   POINT MODEL
   Every flower is a cloud of 3D points. Each point has a colour, a
   material (which decides the character it is drawn with) and a normal
   (for lighting). Stems also carry a tangent so they draw as / | \ -.
   ===================================================================== */
let P = [];
// every flower colour goes into a small palette; cells show palette colour x brightness step
const PAL = [], PAL_IDX = new Map();
function palIndex(col) {
  let i = PAL_IDX.get(col);
  if (i === undefined) { i = PAL.length; PAL.push(rgb(col)); PAL_IDX.set(col, i); }
  return i;
}
function addP(p, col, mat, n, t) {
  P.push({ x: p[0], y: p[1], z: p[2], c: rgb(col), ci: palIndex(col), m: mat, n: n || [0, 1, 0], t: t || null });
}
// A local frame at a flower head: n points out of the face, u/v span it.
const HEAD_SCALE = 1.8;
function frame(c, n) {
  n = norm(n);
  const u = norm(cross(Math.abs(n[1]) < 0.95 ? [0, 1, 0] : [1, 0, 0], n)), v = cross(n, u), k = HEAD_SCALE;
  return {
    c, n, u, v,
    at: (a, b, h) => [c[0] + (u[0] * a + v[0] * b + n[0] * h) * k, c[1] + (u[1] * a + v[1] * b + n[1] * h) * k, c[2] + (u[2] * a + v[2] * b + n[2] * h) * k],
    dir: (a, b, h) => norm([u[0] * a + v[0] * b + n[0] * h, u[1] * a + v[1] * b + n[1] * h, u[2] * a + v[2] * b + n[2] * h]),
  };
}
// flat or cupped disc (cup > 0 opens upward like a poppy, < 0 domes like a daisy centre)
function disc(F, R, h, cup, fn, step = 0.22) {
  const k = cup / (R * R);
  for (let a = -R; a <= R + 1e-6; a += step) for (let b = -R; b <= R + 1e-6; b += step) {
    const d = Math.hypot(a, b); if (d > R) continue;
    const res = fn(d, Math.atan2(b, a)); if (!res) continue;
    addP(F.at(a, b, h + k * d * d), res[0], res[1], F.dir(-2 * k * a, -2 * k * b, 1));
  }
}
// sphere-ish shell of points; fn(y, theta) -> [colour, material, radiusScale]
function shell(F, R, h, minY, fn, step = 0.22) {
  const N = Math.ceil(4 * Math.PI * R * R / (step * step));
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + 0.5) / N; if (y < minY) continue;
    const rr = Math.sqrt(1 - y * y), th = i * 2.39996;
    const res = fn(y, th); if (!res) continue;
    const d = F.dir(Math.cos(th) * rr, Math.sin(th) * rr, y), rad = R * (res[2] || 1), o = F.at(0, 0, h);
    addP([o[0] + d[0] * rad, o[1] + d[1] * rad, o[2] + d[2] * rad], res[0], res[1], d);
  }
}
// tapered spike along the frame normal; fn(t, theta) -> [colour, material]
function spike(F, H, radFn, fn, step = 0.22) {
  for (let k = 0; k <= H; k += step * 0.85) {
    const t = k / H, rad = radFn(t), n = Math.max(1, Math.round(2 * Math.PI * rad / step));
    for (let i = 0; i < n; i++) {
      const th = i / n * 6.283 + k * 0.7, res = fn(t, th); if (!res) continue;
      addP(F.at(Math.cos(th) * rad, Math.sin(th) * rad, k), res[0], res[1], F.dir(Math.cos(th), Math.sin(th), 0.4));
    }
  }
}
function seg(a, b, col, mat = 'stem', step = 0.28) {
  const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], L = Math.hypot(d[0], d[1], d[2]), t = norm(d);
  const n = Math.max(1, Math.ceil(L / step));
  for (let i = 0; i <= n; i++) addP([a[0] + d[0] * i / n, a[1] + d[1] * i / n, a[2] + d[2] * i / n], col, mat, [0, 1, 0], t);
}
function bez(a, c, b, col, mat, onPt) {
  let prev = a;
  for (let i = 1; i <= 30; i++) {
    const t = i / 30, u = 1 - t;
    const p = [0, 1, 2].map(k => u * u * a[k] + 2 * u * t * c[k] + t * t * b[k]);
    seg(prev, p, col, mat);
    if (onPt) onPt(p, t);
    prev = p;
  }
}
// small sub-flower at an offset inside a head frame
const sub = (F, a, b, h, tilt = 0.5) => frame(F.at(a, b, h), F.dir(a * tilt, b * tilt, 1));

/* ---------- species ----------
   az: true = native to the Sonoran Desert (southern Arizona to Phoenix) */
const SPECIES = {
  /* Colours follow the flower's shape (bands, sectors, distance from the
     centre) rather than being random per point. Random speckles shimmer
     as the bouquet turns because neighbouring points take turns winning
     each character cell. */

  /* ----- Arizona natives ----- */
  mexicanGoldPoppy: { az: true, fn(F, r) {
    const rot = r() * 6.28;
    disc(F, 2.8, 0, 2.2, (d, a) => d < 0.5 ? null : Math.cos(4 * (a + rot)) < -0.75 && d > 2 ? null
      : [d < 1.1 ? 0xff8a10 : d > 2.2 ? 0xffde5a : 0xffc21a, 'petal']);
    disc(F, 0.55, 0.35, 0, () => [0xd86a10, 'center']);
  } },
  desertLupine: { az: true, spike: true, fn(F, r) {
    const H = 6 + r() * 1.5;
    // whorls: each band is purple-blue with a white "banner" on its upper edge
    spike(F, H, t => 1.5 * (1 - t) + 0.3, t => {
      if (t > 0.85) return [0xa8a8ff, 'spike'];
      const w = (t * 7) % 1;
      return [w > 0.72 ? 0xe8e8ff : w > 0.36 ? 0x7a6af2 : 0x5a4ad8, 'spike'];
    });
  } },
  owlsClover: { az: true, spike: true, fn(F, r) {
    const H = 4.5 + r();
    // magenta spike, banded, with white-and-yellow tipped top
    spike(F, H, t => 1.15 * (1 - t * 0.55), t => {
      if (t > 0.8) return [0xfff0f6, 'spike'];
      if (t > 0.68) return [0xffe070, 'spike'];
      return [(t * 5) % 1 > 0.5 ? 0xd6407a : 0xc03272, 'spike'];
    });
  } },
  desertMarigold: { az: true, fn(F, r) {
    const rot = r() * 6.28;
    disc(F, 3.0, 0, 0.4, (d, a) => d < 1 ? null : Math.cos(9 * (a + rot)) > -0.6 || d < 2.1 ? [d > 2.4 ? 0xffe46a : 0xffd21f, 'petal'] : null);
    disc(F, 1.1, 0.5, -0.5, d => [d < 0.5 ? 0xf8c020 : 0xe8a000, 'center']);
  } },
  brittlebush: { az: true, fn(F, r) {
    for (let i = 0; i < 3; i++) {
      const a = Math.cos(i * 2.1 + r()) * 1.9, b = Math.sin(i * 2.1 + r()) * 1.9, h = r() * 1.2;
      seg(F.at(0, 0, -1), F.at(a, b, h - 0.2), 0x9aa880);
      const S = sub(F, a, b, h, 0.3), rot = r() * 6;
      disc(S, 1.6, 0, 0.3, (d, ang) => d < 0.5 ? null : Math.cos(7 * (ang + rot)) > -0.5 || d < 1.2 ? [0xffcf20, 'petal'] : null);
      disc(S, 0.55, 0.25, -0.2, () => [0x6a3a14, 'center']);
    }
  } },
  globemallow: { az: true, spike: true, fn(F, r) {
    const H = 6;
    seg(F.at(0, 0, 0), F.at(0, 0, H), 0x7a9a5a);
    for (let k = 1; k < H; k += 1.4) {
      const th = k * 2.4, a = Math.cos(th), b = Math.sin(th);
      const S = frame(F.at(a * 0.7, b * 0.7, k), F.dir(a, b, 0.7));
      disc(S, 1.0, 0, 0.6, d => [d < 0.35 ? 0xffd08a : 0xff7a3a, 'petal']);
    }
    disc(frame(F.at(0, 0, H + 0.2), F.n), 0.5, 0, 0, () => [0xffb080, 'dots']);
  } },
  parrysPenstemon: { az: true, spike: true, fn(F, r) {
    const H = 6.5;
    seg(F.at(0, 0, 0), F.at(0, 0, H), 0x5f8a3a);
    // tubular flowers drawn as small solid cones pointing outward
    for (let k = 0.6; k < H; k += 1.1) {
      for (const side of [0, Math.PI]) {
        const th = side + k * 1.3, a = Math.cos(th), b = Math.sin(th);
        const S = frame(F.at(a * 0.3, b * 0.3, k), F.dir(a, b, -0.35));
        spike(S, 1.5 * (1 - k / H * 0.4), t => 0.25 + t * 0.4, t => [t > 0.75 ? 0xff9ac8 : 0xf0509a, 'petal']);
      }
    }
  } },
  fairyDuster: { az: true, fn(F, r) {
    // pom-pom of pink stamens: a fuzzy ball, deeper pink inside, pale tips outside
    shell(F, 1.4, 0.5, -0.4, () => [0xe0306e, 'spike']);
    shell(F, 2.5, 0.5, -0.3, (y, th) => Math.cos(th * 7) * Math.cos(y * 9) > -0.3 ? [0xff5aa0, 'spiky', 0.92] : null);
    shell(F, 2.9, 0.5, -0.2, (y, th) => Math.cos(th * 7) * Math.cos(y * 9) > 0.45 ? [0xffd0e6, 'dots'] : null);
  } },
  mariposaLily: { az: true, fn(F, r) {
    const rot = r() * 6.28;
    disc(F, 2.9, 0, 2.6, (d, a) => {
      const m = Math.cos(3 * (a + rot)); if (m < -0.15 && d > 0.8) return null;
      if (d > 0.9 && d < 1.45 && m > 0.6) return [0x6a1020, 'center'];
      return [d < 0.9 ? 0xffd040 : d > 2.2 ? 0xffa040 : 0xff6a10, 'petal'];
    });
  } },
  sandVerbena: { az: true, fn(F, r) {
    // round cluster: magenta florets with paler centres in a regular pattern
    shell(F, 1.9, 0.4, -0.2, (y, th) => [Math.cos(th * 5) * Math.cos(y * 6) > 0.55 ? 0xf6c8f6 : y > 0.4 ? 0xe080e0 : 0xc050c0, 'petal']);
  } },
  saguaroBlossom: { az: true, fn(F, r) {
    const rot = r() * 6.28;
    disc(F, 2.6, 0, 1.5, (d, a) => d < 1 ? null : Math.cos(6 * (a + rot)) > -0.7 || d < 1.8 ? [d > 2 ? 0xffffff : 0xece8d8, 'petal'] : null);
    disc(F, 1.15, 0.45, -0.3, d => [d < 0.5 ? 0xfff090 : 0xffd84a, 'center']);
  } },

  /* ----- classic wildflowers ----- */
  daisy: { az: false, fn(F, r) {
    const R = 3 + r() * 0.5, rot = r() * 6.28;
    disc(F, R, 0, 0.5, (d, a) => d < 1.1 ? null : Math.cos(8 * (a + rot)) > -0.45 || d < 2 ? [d > R - 0.6 ? 0xf2efe6 : 0xffffff, 'petal'] : null);
    disc(F, 1.15, 0.35, -0.4, d => [d < 0.5 ? 0xffd84a : 0xf2b92e, 'center']);
  } },
  redPoppy: { az: false, fn(F, r) {
    const rot = r() * 6.28;
    disc(F, 3, 0, 2.2, (d, a) => d < 0.8 ? null : [Math.cos(4 * (a + rot)) > 0.2 ? 0xe8302a : 0xc81e18, 'petal']);
    disc(F, 0.85, 0.4, 0, () => [0x2a1a1a, 'center']);
  } },
  cornflower: { az: false, fn(F, r) {
    shell(F, 1.2, 0.6, -0.1, () => [0x5a2a8a, 'center']);
    // ragged edge made from a regular pattern of florets
    shell(F, 2.4, 0.4, 0.0, (y, th) => {
      const m = Math.cos(th * 8) * Math.cos(y * 7);
      return m > -0.35 ? [y > 0.5 ? 0x5a7af0 : 0x3b5bd9, 'spiky', 0.8 + 0.2 * Math.max(0, m)] : null;
    });
  } },
  wildRose: { az: false, fn(F, r) {
    const rot = r() * 6.28;
    disc(F, 3, 0, 0.8, (d, a) => Math.cos(5 * (a + rot)) > -0.45 || d < 2.1 ? [d > 2.2 ? 0xffb8d2 : d > 1.2 ? 0xf28ab2 : 0xe86a9a, 'petal'] : null);
    disc(F, 0.8, 0.4, -0.3, () => [0xffd84d, 'center']);
  } },
  lavender: { az: false, spike: true, fn(F, r) {
    spike(F, 5.5, t => 0.65 * (1 - t * 0.5), t => [(t * 8) % 1 > 0.5 ? 0x8e6bc9 : 0x6d4fb0, 'spike']);
  } },
};

const FILLERS = {
  creosote(F, r) {   // Arizona: creosote bush sprig with tiny yellow flowers
    for (let i = 0; i < 5; i++) {
      const tip = F.at((r() - 0.5) * 5, (r() - 0.5) * 5, 1 + r() * 2.5);
      seg(F.at(0, 0, -1), tip, 0x6a7a4a);
      addP(tip, 0xffe040, 'dots', F.n);
      if (r() < 0.6) addP([tip[0] + 0.4, tip[1] - 0.3, tip[2]], 0x5a8a3a, 'leaf', F.n);
    }
  },
  grass(F, r) {
    for (let i = 0; i < 3; i++) {
      const a = (r() - 0.5) * 5, b = (r() - 0.5) * 5;
      bez(F.at(0, 0, -2), F.at(a * 0.2, b * 0.2, 1.5), F.at(a, b, 2.5 + r() * 2), i ? 0x7fb04a : 0x9cc860, 'stem');
    }
  },
  seedhead(F, r) {   // desert grass seed heads
    spike(F, 3.5, t => 0.45 * (1 - t), t => [(t * 6) % 1 > 0.5 ? 0xd9b45a : 0xe8cc80, 'spike']);
  },
  babysBreath(F, r) {
    for (let i = 0; i < 6; i++) {
      const tip = F.at((r() - 0.5) * 6, (r() - 0.5) * 6, r() * 3);
      seg(F.at(0, 0, -1), tip, 0x8ab060);
      addP(tip, 0xffffff, 'dots', F.n);
    }
  },
};

let bounds = { minY: 0, maxY: 40, maxR: 14 }, lastHeads = [];
function buildBouquet(seed) {
  P = [];
  const r = mulberry32(seed);
  const az = Object.keys(SPECIES).filter(k => SPECIES[k].az), classic = Object.keys(SPECIES).filter(k => !SPECIES[k].az);
  const kinds = CONFIG.arizonaOnly
    ? shuffle(az, r).slice(0, 4 + Math.floor(r() * 3))
    : [...shuffle(az, r).slice(0, 3 + Math.floor(r() * 2)), ...shuffle(classic, r).slice(0, 1 + Math.floor(r() * 2))];
  let stems = [];
  for (const k of kinds) { const c = 2 + Math.floor(r() * 2); for (let i = 0; i < c; i++) stems.push({ kind: k }); }
  while (stems.length < 10) stems.push({ kind: pick(kinds, r) });
  stems = shuffle(stems, r).slice(0, 12); // cap the flower count so heads have room
  const fillerKinds = CONFIG.arizonaOnly ? ['creosote', 'grass', 'seedhead'] : Object.keys(FILLERS);
  for (let i = 0, nf = 2 + Math.floor(r() * 2); i < nf; i++) stems.push({ kind: pick(fillerKinds, r), fill: true });
  stems = shuffle(stems, r);

  // 1) initial head positions on a wide dome
  const R = 12 + stems.length * 0.55, Y0 = 16, Y1 = 40;
  const heads = stems.map((s, i) => {
    const t = (i + 0.5) / stems.length;
    const rad = R * Math.sqrt(t) * (0.9 + 0.2 * r()), ang = i * 2.39996 + r() * 0.4;
    let y = 18 + Math.sqrt(Math.max(0, 1 - (rad / (R * 1.1)) ** 2)) * 15 + (r() * 8 - 4);
    const spike = !s.fill && SPECIES[s.kind].spike;
    if (spike) y -= 3;
    if (s.fill) y -= 1.5;
    // spikes are tall, so measure their spacing from the middle of the spike
    return { s, x: Math.cos(ang) * rad, y, z: Math.sin(ang) * rad, lift: spike ? 5 : 0, size: s.fill ? 3 : 5 };
  });
  // 2) push apart any heads that sit too close (simple relaxation)
  for (let it = 0; it < 80; it++) {
    for (let i = 0; i < heads.length; i++) for (let j = i + 1; j < heads.length; j++) {
      const A = heads[i], B = heads[j];
      const dx = B.x - A.x, dy = (B.y + B.lift) - (A.y + A.lift), dz = B.z - A.z;
      const d = Math.hypot(dx, dy, dz) || 0.01, min = A.size + B.size;
      if (d >= min) continue;
      const push = (min - d) / d * 0.5;
      A.x -= dx * push; A.y -= dy * push; A.z -= dz * push;
      B.x += dx * push; B.y += dy * push; B.z += dz * push;
    }
    for (const h of heads) { // stay inside the bouquet's overall shape
      const rr = Math.hypot(h.x, h.z), lim = R * 1.15;
      if (rr > lim) { h.x *= lim / rr; h.z *= lim / rr; }
      h.y = clamp(h.y, Y0, Y1 - h.lift);
    }
  }
  // 3) stems and heads
  for (const { s, x: hx, y: hy, z: hz } of heads) {
    const n = norm([hx / R * 0.85 + (r() - 0.5) * 0.3, 1, hz / R * 0.85 + (r() - 0.5) * 0.3]);
    const head = [hx, hy, hz];
    const stemCol = pick([0x4f8a2b, 0x5a9a34, 0x467a28], r);
    bez([(r() - 0.5) * 0.5, 0, (r() - 0.5) * 0.5], [hx * 0.3, hy * 0.5, hz * 0.3], [hx - n[0] * 0.4, hy - n[1] * 0.4, hz - n[2] * 0.4], stemCol, 'stem', (p, tt) => {
      if (tt > 0.3 && tt < 0.8 && r() < 0.09) {
        const la = r() * 6.28, L = 1.5 + r() * 1.5;

/* =====================================================================
   BACKGROUND: slow colour drift + twinkling character stars

const SKY = [ // t, top, bottom, flower tint

/* =====================================================================
   PARTICLES (all made of characters)
   ===================================================================== */

  anniversary: { sparkle: 3, ring: 0.6, star: 0.7, heart: 3 },
  valentine:   { sparkle: 3, ring: 0.5, star: 0.5, heart: 4.5 },

/* =====================================================================
   MAIN LOOP + INPUT
   ===================================================================== */
let angle = Math.random() * 6.28, spinVel = CONFIG.spinSpeed, popT = 1, pendingSeed = null;

}

const START_T = clamp(parseFloat(params.get('time')) || 0, 0, 0.999);
const t0 = performance.now();
let last = t0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  let s = 1;

cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') newBouquet(); });
addEventListener('resize', resize);
if (document.fonts) document.fonts.ready.then(() => resetAtlas());

/* ---------- start ---------- */
const msg = todaysMessage();
theme = msg.theme;
document.getElementById('msg').textContent = msg.text;
document.getElementById('hint').textContent = (matchMedia('(pointer: coarse)').matches ? 'tap' : 'click') + ' for a new bouquet · drag to spin';
buildBouquet((Math.random() * 2 ** 31) | 0);
resize();
requestAnimationFrame(loop);
setTimeout(() => document.getElementById('msg').classList.add('show'), 800);
setTimeout(() => document.getElementById('hint').classList.add('show'), 2500);
setTimeout(() => document.getElementById('hint').classList.remove('show'), 9000);
</script>
